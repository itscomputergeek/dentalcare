{% extends 'appointments/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h2 class="text-2xl font-semibold mb-4">Contact Us</h2>
    <form method="POST" action="{% url 'contact' %}" class="space-y-4">
        {% csrf_token %}
        <input type="text" placeholder="Your Name" class="w-full p-2 border rounded" required />
        <input type="email" placeholder="Your Email" class="w-full p-2 border rounded" required />
        <textarea placeholder="Your Message" class="w-full p-2 border rounded" required></textarea>
        <button type="submit" class="bg-blue-600 text-white hover:bg-blue-700 py-2 px-4 rounded">Send Message</button>
    </form>
</div>
{% endblock %}

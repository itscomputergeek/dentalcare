{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto text-center">
    <img src="https://images.unsplash.com/photo-1588776814546-ec3a9c0e5463" alt="Dental Clinic" class="rounded-2xl shadow-md w-full mb-6" />
    <h2 class="text-3xl font-semibold mb-4">Welcome to DentalCare</h2>
    <p class="mb-6">Your trusted dental clinic for quality oral healthcare.</p>
    <button class="text-white bg-blue-600 hover:bg-blue-700 py-2 px-4 rounded" onclick="document.getElementById('appointmentForm').style.display = 'block'">
        Book an Appointment
    </button>

    <div id="appointmentForm" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50" style="display: none;">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md relative">
            <button onclick="document.getElementById('appointmentForm').style.display = 'none'" class="absolute top-2 right-4 text-xl">&times;</button>
            <h3 class="text-xl font-semibold mb-4">Book an Appointment</h3>
            <form method="POST" action="{% url 'home' %}" class="space-y-4">
                {% csrf_token %}
                <input type="text" name="name" placeholder="Your Name" class="w-full p-2 border rounded" required />
                <input type="email" name="email" placeholder="Your Email" class="w-full p-2 border rounded" required />
                <input type="date" name="date" class="w-full p-2 border rounded" required />
                <input type="time" name="time" class="w-full p-2 border rounded" required />
                <textarea name="message" placeholder="Additional Notes" class="w-full p-2 border rounded"></textarea>
                <button type="submit" class="bg-blue-600 text-white hover:bg-blue-700 py-2 px-4 rounded">Submit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
